# Configuración de Nixpacks para Railway.
# Asegura Node 20+, npm ci limpio, y que el proyecto está dentro de ferreteria-hco/.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["cd ferreteria-hco && npm ci"]

[phases.build]
cmds = ["cd ferreteria-hco && npm run build"]

[start]
cmd = "cd ferreteria-hco && npm start"
